[package]
name = "simple-analog-clock"
version = "0.1.13"
edition = "2024"
rust-version = "1.88"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ron = "0.11"
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
